<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Live no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;background:#EDEEF0;color:#111214}
a{color:#111214}a:hover{color:#44474D}
h1,h2,h3{margin:0}
button,input{font-family:inherit}
@keyframes lsIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ls-in{animation:lsIn .5s cubic-bezier(.2,.7,.2,1) both}
button{transition:background-color .2s ease,transform .15s ease}
button:active{transform:scale(.97)}
button,a{white-space:nowrap;flex-shrink:0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #EDEEF0; position: relative; overflow: hidden">
  <div style="height: 214px; flex-shrink: 0; border-radius: 22px; background: #141518; position: relative; display: flex; align-items: center; justify-content: center; color: #7C8088; font-size: 13px">
    Vídeo ao vivo
    <span style="position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: #C92A2F; color: #FFFFFF; font-size: 10px; font-weight: 600; letter-spacing: 0.06em"><span style="width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF"></span>AO VIVO</span>
    <span style="position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #FFFFFF; font-size: 11px">312 assistindo</span>
  </div>

  <div role="status" style="padding: 8px 14px 8px 8px; border-radius: 999px; background: #141518; color: #FFFFFF; display: flex; gap: 10px; align-items: center">
    <span style="width: 32px; height: 32px; border-radius: 50%; background: #D6F35B; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></span>
    <span style="font-size: 13px; flex-grow: 1">Pedido registrado</span>
    <span style="font-size: 13px; color: #D6F35B; font-weight: 500">Total 1.500 un.</span>
  </div>

  <div class="ls-in" style="flex-grow: 1; box-sizing: border-box; padding: 16px; border-radius: 22px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; gap: 12px; align-items: center">
      <span style="width: 64px; height: 64px; border-radius: 16px; background: repeating-linear-gradient(135deg, #F1F2F4 0 5px, #F7F8F9 5px 10px); flex-shrink: 0"></span>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="align-self: flex-start; padding: 3px 9px; border-radius: 999px; background: #D6F35B; font-size: 11px; font-weight: 500">Disponível por <span style="font-family: 'Geist Mono', monospace">12:40</span></span>
        <span style="font-size: 18px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15">Ventilador de mesa 40 cm</span>
        <span style="font-size: 12px; color: #6B6F76">R$ 89,90/un. · Estoque 4.800</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="qtdm" style="font-size: 12px; color: #6B6F76">Quantidade</label>
      <div style="height: 58px; box-sizing: border-box; padding: 0 18px; border-radius: 16px; background: #F4F5F6; display: flex; align-items: center; gap: 8px"><input id="qtdm" inputmode="numeric" value="500" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 26px; font-weight: 500; letter-spacing: -0.03em"><span style="font-size: 13px; color: #6B6F76">un.</span></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <button style="height: 44px; border-radius: 999px; border: 1px solid #E4E6EA; background: #FFFFFF; font-size: 13px; font-weight: 500">+10</button>
        <button style="height: 44px; border-radius: 999px; border: 1px solid #E4E6EA; background: #FFFFFF; font-size: 13px; font-weight: 500">+50</button>
        <button style="height: 44px; border-radius: 999px; border: 1px solid #E4E6EA; background: #FFFFFF; font-size: 13px; font-weight: 500">+100</button>
        <button style="height: 44px; border-radius: 999px; border: 1px solid #E4E6EA; background: #FFFFFF; font-size: 13px; font-weight: 500">+1.000</button>
      </div>
    </div>
    <div style="flex-grow: 1"></div>
    <button style="height: 56px; border-radius: 999px; border: none; background: #111214; color: #FFFFFF; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; padding: 0 7px 0 22px">Registrar pedido<span style="width: 42px; height: 42px; border-radius: 50%; background: #D6F35B; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></span></button>
  </div>

  <div style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 18px; border-radius: 22px; background: #FFFFFF; display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 12px; color: #6B6F76">Seus pedidos</span>
    <span style="font-size: 20px; font-weight: 500; letter-spacing: -0.03em">1.500 un. <span style="font-size: 12px; color: #6B6F76; letter-spacing: 0">· 2 produtos</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
