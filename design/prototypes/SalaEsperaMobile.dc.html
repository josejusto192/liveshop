<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sala de espera no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;background:#141518;color:#FFFFFF}
a{color:#FFFFFF}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer}
@keyframes lsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lsPop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes lsPulse{0%,100%{opacity:1}50%{opacity:.45}}
.ls-in{animation:lsIn .5s cubic-bezier(.2,.7,.2,1) both}
.ls-pop{animation:lsPop .35s cubic-bezier(.2,.7,.2,1) both}
.ls-pulse{animation:lsPulse 1.6s ease-in-out infinite}
button,a{transition:background-color .2s ease,opacity .2s ease,transform .15s ease;white-space:nowrap;flex-shrink:0}
button:active,a:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 14px; background: #141518; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <span style="width: 36px; height: 36px; border-radius: 50%; background: #D6F35B; color: #111214; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">ME</span>
    <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">Marca Exemplo</span><span style="font-size: 12px; color: #A9ADB5">Lançamento Coleção Verão</span></span>
    <span style="padding: 4px 10px; border-radius: 999px; background: {{ chipBg }}; color: {{ chipFg }}; font-size: 10px; font-weight: 600; letter-spacing: 0.06em">{{ chip }}</span>
  </div>

  <div class="ls-in" style="height: 300px; flex-shrink: 0; border-radius: 24px; background: #1E2024; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
    <sc-if value="{{ waiting }}" hint-placeholder-val="{{ true }}">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #A9ADB5"><span class="ls-pulse" style="width: 7px; height: 7px; border-radius: 50%; background: #D6F35B"></span>Sala de espera</span>
      <span style="font-size: 14px; color: #D5D8DE">Começa em</span>
      <span style="font-family: 'Geist Mono', monospace; font-size: 58px; letter-spacing: -0.05em; line-height: 1; color: #D6F35B">{{ countdown }}</span>
      <span style="font-size: 12px; color: #A9ADB5">Hoje, 14:00 · entra sozinho quando começar</span>
    </sc-if>
    <sc-if value="{{ started }}" hint-placeholder-val="{{ false }}">
      <span class="ls-in" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #C92A2F; font-size: 11px; font-weight: 600; letter-spacing: 0.06em"><span style="width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF"></span>AO VIVO</span>
      <span class="ls-in" style="font-size: 28px; font-weight: 500; letter-spacing: -0.03em">A live começou</span>
      <a class="ls-in" href="LiveVertical.dc.html" style="height: 54px; border-radius: 999px; background: #D6F35B; color: #111214; font-size: 15px; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 0 7px 0 22px">Entrar na live<span style="width: 40px; height: 40px; border-radius: 50%; background: #111214; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D6F35B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
    </sc-if>
  </div>

  <div style="display: flex; gap: 8px">
    <button onClick="{{ addCal }}" style="flex-grow: 1; height: 46px; border-radius: 999px; border: 1px solid #3A3D44; background: transparent; color: #FFFFFF; font-size: 13px">Adicionar à agenda</button>
    <button onClick="{{ remind }}" style="flex-grow: 1; height: 46px; border-radius: 999px; border: 1px solid #3A3D44; background: transparent; color: #FFFFFF; font-size: 13px">Avisar no WhatsApp</button>
  </div>

  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 16px; border-radius: 22px; background: #FFFFFF; color: #111214; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
    <span style="font-size: 14px; font-weight: 500; padding-bottom: 8px">O que vai ser apresentado</span>
    <sc-for list="{{ lineup }}" as="p" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; border-top: 1px solid #F1F2F4"><span style="width: 34px; height: 34px; border-radius: 10px; background: #F1F2F4"></span><span style="flex-grow: 1; font-size: 13px; font-weight: 500">{{ p.name }}</span><span style="font-size: 11px; color: #6B6F76">{{ p.info }}</span></div>
    </sc-for>
  </div>

  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
    <div role="status" class="ls-pop" style="position: absolute; left: 16px; right: 16px; top: 16px; padding: 12px 16px; border-radius: 999px; background: #FFFFFF; color: #111214; font-size: 13px; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 30px rgba(0,0,0,0.35)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #7CB518"></span>{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { left: 12, toast: '' }; }
  componentDidMount() { var self = this; this.iv = setInterval(function () { if (self.state.left > 0) self.setState({ left: self.state.left - 1 }); }, 1000); }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.tt); }
  flash(m) { var self = this; this.setState({ toast: m }); clearTimeout(this.tt); this.tt = setTimeout(function () { self.setState({ toast: '' }); }, 2400); }
  renderVals() {
    var self = this, s = this.state, w = s.left > 0;
    var items = [['Caneta esferográfica azul', '82.000 un.'], ['Ventilador de mesa 40 cm', '4.800 un.'], ['Garrafa térmica 1 L', '12.000 un.'], ['Kit organizador de mesa', '320 un.'], ['Luminária LED articulada', '2.000 un.']];
    return {
      waiting: w, started: !w,
      countdown: '00:' + (s.left < 10 ? '0' : '') + s.left,
      chip: w ? 'EM BREVE' : 'AO VIVO', chipBg: w ? '#26282D' : '#C92A2F', chipFg: '#FFFFFF',
      lineup: items.map(function (p) { return { name: p[0], info: p[1] }; }),
      toast: s.toast,
      addCal: function () { self.flash('Evento salvo na sua agenda'); },
      remind: function () { self.flash('Vamos avisar no WhatsApp quando começar'); }
    };
  }
}
</script>
</body>
</html>
